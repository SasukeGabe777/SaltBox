# SaltBox hosted demo renderer (ADR-003 delivery surface, ADR-005/006 data path).
#
# Committed, NON-SECRET configuration only. Connection strings and API tokens
# are Worker secrets / provider bindings and never live in this file.
#
# ONE renderer serves MANY demos. There is deliberately no per-prospect
# project, deployment, route, or bucket.
#
# The resources below were provisioned once with:
#
#   wrangler r2 bucket create saltbox-demo-assets
#   wrangler hyperdrive create saltbox-demos \
#     --connection-string "<neon-unpooled-url>" --caching-disabled
#
# The Hyperdrive id is a non-secret resource identifier; the connection string
# it wraps is stored by Cloudflare and never appears in this repository.
# `pnpm demos:deploy` refuses to run while a REPLACE_WITH_ placeholder remains.

name = "saltbox-demos"
main = "worker/index.ts"
# Node.js compatibility layers are on by default from 2026-08-04; the flag is
# stated explicitly so the requirement stays visible (ADR-006).
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The hosted renderer is read-only and public by design: it serves ONLY
# operator-approved demo versions, never enumerates demos, and never accepts a
# mutation. The mutable admin is NOT hosted (Phase 10 item 50).
[observability]
enabled = true

# Authoritative demo metadata: Neon PostgreSQL through Hyperdrive with caching
# disabled — approval state must never be served stale (ADR-005).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "bd10802e4efb432085ada1ba17b8d2e9"

# Durable demo assets (logos and photography). Blobs never enter PostgreSQL.
[[r2_buckets]]
binding = "DEMO_ASSETS"
bucket_name = "saltbox-demo-assets"
